<script>
  /* the game owns the right mouse button (walk-to / examine menus), so the
     browser's own context menu, middle-click autoscroll and text/image dragging
     are all suppressed page-wide */
  (function () {
    var kill = function (e) { e.preventDefault(); return false; };
    window.addEventListener("contextmenu", kill, { capture: true });
    window.addEventListener("mousedown", function (e) { if (e.button === 2 || e.button === 1) e.preventDefault(); }, { capture: true });
    window.addEventListener("mouseup", function (e) { if (e.button === 2 || e.button === 1) e.preventDefault(); }, { capture: true });
    window.addEventListener("pointerdown", function (e) { if (e.button !== 0) e.preventDefault(); }, { capture: true });
    window.addEventListener("pointerup", function (e) { if (e.button !== 0) e.preventDefault(); }, { capture: true });
    window.addEventListener("auxclick", function (e) { if (e.button !== 0) e.preventDefault(); }, { capture: true });
    window.addEventListener("dragstart", kill, { capture: true });
    window.addEventListener("selectstart", function (e) { if (!/^(INPUT|TEXTAREA)$/.test((e.target && e.target.tagName) || "")) kill(e); }, { capture: true });
  })();
  /* Mobile touch capture: a press that starts on the game belongs to the game,
     never to the browser. The CSS (`touch-action`) already says this where the
     browser honors it; this is the half for where it does not (older iOS):
     `touchmove` on the 3D surface never becomes a page scroll or a
     pull-to-refresh, `gesturestart` never becomes a page pinch-zoom, and a
     double-tap on the frame never zooms. The game's own tap/hold/pinch/orbit
     gestures listen to pointer events, which none of this cancels, and native
     scrollers and form fields are left alone. */
  (function () {
    var onSurface = function (t) { return !!(t && t.closest && t.closest("#gameCanvas,#fxLayer")); };
    var inField = function (t) { return !!(t && t.closest && t.closest("INPUT,TEXTAREA,SELECT")); };
    window.addEventListener("touchmove", function (e) {
      if (e.touches && e.touches.length && onSurface(e.target)) e.preventDefault();
    }, { capture: true, passive: false });
    window.addEventListener("gesturestart", function (e) { e.preventDefault(); }, { capture: true, passive: false });
    window.addEventListener("dblclick", function (e) {
      var t = e.target;
      if (t && t.closest && t.closest("#frameHost") && !inField(t)) e.preventDefault();
    }, { capture: true });
  })();
</script>
